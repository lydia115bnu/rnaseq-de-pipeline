# envs/enrichment.yml — pathway enrichment tools
# Install: mamba env create -f envs/enrichment.yml
name: enrichment
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - r-base=4.3.2
  - bioconductor-clusterprofiler=4.10.0
  - bioconductor-fgsea=1.28.0
  - bioconductor-enrichplot=1.22.0
  - bioconductor-org.hs.eg.db=3.18.0
  - bioconductor-pathview=1.42.0
  - r-ggplot2=3.5.0
  - r-optparse=1.7.4
  - r-dplyr=1.1.4
  - r-readr=2.1.5
  - r-scales=1.3.0
